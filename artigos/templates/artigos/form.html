{% extends 'portfolio/base.html' %}

{% block content %}
<section>
  <div class="sec-head" style="margin-bottom:24px;">
    <h2>{{ titulo }}</h2>
  </div>

  <form method="post" enctype="multipart/form-data" style="max-width:560px;display:flex;flex-direction:column;gap:16px;">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <p style="font-size:11px;color:#f87171;margin-top:4px;">{{ field.errors|join:", " }}</p>
      {% endif %}
    </div>
    {% endfor %}
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn">Guardar</button>
      <a href="{% url 'artigos_lista' %}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</section>

<style>
  input[type=text], input[type=url], textarea {
    width: 100%;
    background: var(--surface);
    border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { border-color: var(--accent); }
  input[type=file] { font-size: 12px; color: var(--muted); }
</style>
{% endblock %}
